# Angime — nginx (host) → docker: frontend :3001, backend :8001

upstream angime_frontend { server 127.0.0.1:3001; }
upstream angime_backend  { server 127.0.0.1:8001; }

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name danyshpan.xyz www.danyshpan.xyz server.danyshpan.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danyshpan.xyz www.danyshpan.xyz server.danyshpan.xyz;

    ssl_certificate     /etc/letsencrypt/live/server.danyshpan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.danyshpan.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Backend API + webhook
    location /api/ {
        proxy_pass http://angime_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook {
        proxy_pass http://angime_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://angime_backend;
        proxy_set_header Host $host;
    }

    # Frontend
    location / {
        proxy_pass http://angime_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
